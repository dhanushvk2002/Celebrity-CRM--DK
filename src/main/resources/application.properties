spring.application.name=celebrity-crm
server.port=8080

# ==========================================
# Database Configuration (MySQL)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/celebrity_crm?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA & Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Flyway Migration
# ==========================================
spring.flyway.enabled=false

# ==========================================
# JWT Configuration
# ==========================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# ==========================================
# File Storage Configuration
# ==========================================
app.file.upload-dir=./uploads

# ==========================================
# Servlet Multipart File Upload
# ==========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ==========================================
# Actuator & Management Endpoints
# ==========================================
management.endpoints.web.exposure.include=health,info
